<div *ngIf="loading$ | async" class="loading">Loading...</div>
<table *ngIf="!(loading$ | async)">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Role</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of users$ | async">
      <td>{{ user.id }}</td>
      <td>{{ user.firstName }} {{ user.lastName }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.role }}</td>
      <td>
        <button [routerLink]="['/users/edit', user.id]">Edit</button>
        <button (click)="deleteUser(user.id, user.firstName)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
<button routerLink="/users/new">Add User</button>
