<div *ngIf="loading$ | async" class="loading">Saving...</div>
<div class="content p-5">
    <div class="row mt-0">
        <div class="col-md-12 p-0">
            <h1 class="title-page mt-2">User form</h1>
        </div>
        <hr>
    </div>
    <div class="row p-0">
        <div class="col-md-4 mat-elevation-z8 p-4">
          <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
            <div>
              <label for="firstName">First Name</label>
              <input matInput required formControlName="firstName" id="firstName" placeholder="First Name" class="form-control mb-2" />
              <div *ngIf="userForm.get('firstName')?.hasError('required')" class="text-danger small">
                First Name is required
              </div>
            </div>
            <div>
              <label for="lastName">Last Name</label>
              <input matInput formControlName="lastName" id="lastName" placeholder="Last Name" class="form-control mb-2" />
              <div *ngIf="userForm.get('lastName')?.hasError('required')" class="text-danger small">
                Last Name is required
              </div>
            </div>
            <div>
              <label for="email">Email</label>
              <input matInput formControlName="email" type="email" id="email" placeholder="Email" class="form-control mb-2" />
              <div *ngIf="userForm.get('email')?.hasError('email')" class="text-danger small">
                Please enter a valid email address
              </div>
            </div>
            <div>
              <label for="age">Age</label>
              <input matInput formControlName="age" type="number" id="age" placeholder="Age" class="form-control mb-2" />
              <div *ngIf="userForm.get('age')?.hasError('min')" class="text-danger small">
                Age must be at least 20
              </div>
            </div>
            <div>
              <label for="role">Role</label>
              <select formControlName="role" id="role" class="form-select mb-2">
                <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
              </select>
            </div>
            <button type="submit" [disabled]="userForm.invalid || (loading$ | async)" mat-raised-button class="mt-3 me-2 {{userForm.invalid || (loading$ | async) ? '' : 'bg-success text-white'}}" >
              {{ isEdit ? 'Update' : 'Create' }}
            </button>
            <button type="button" (click)="cancel()" mat-raised-button class="mt-3 bg-danger text-white" >Cancel</button>
          </form>
        </div>
    </div>
</div>
